<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f3ec">

  <title>My Little Dorm Checklist</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <header>
      <div class="top">
        <span>MY LITTLE CHECKLIST</span>
        <span class="heart">♡</span>
      </div>

      <h1>A little home away from home.</h1>

      <p class="subtitle">
        Everything you need for your stay.
        Take your time. Don't forget anything. ♡
      </p>
    </header>

    <!-- MAIN APP (SHOWS IMMEDIATELY) -->
    <section id="appScreen">

      <div class="dashboard">

        <!-- Progress -->
        <div class="card">
          <div class="progress-header">
            <strong>Packing progress</strong>
            <span id="percentage">0%</span>
          </div>

          <div class="progress-track">
            <div id="progress" class="progress-fill"></div>
          </div>

          <p id="progressText" class="small">
            0 of 0 items completed
          </p>
        </div>

        <!-- Search and add -->
        <div class="toolbar">
          <input
            type="search"
            id="search"
            placeholder="Search your items..."
          >

          <button id="addBtn" class="primary">
            + Add item
          </button>
        </div>

        <!-- Categories -->
        <nav id="categories" class="categories"></nav>

        <!-- Checklist -->
        <div class="card">
          <div class="section-title">
            <strong id="listTitle">Your checklist</strong>
            <span id="itemCount" class="small"></span>
          </div>

          <div id="list"></div>
        </div>

        <!-- Controls -->
        <div class="card">
          <h3>Checklist Options</h3>
          <p id="activityText" class="small">
            Items are automatically saved ♡
          </p>

          <div class="toolbar">
            <button id="resetBtn" class="secondary">
              Uncheck all
            </button>

            <button id="restoreDefaultBtn" class="secondary">
              Reset to Default
            </button>

            <button id="downloadBtn" class="secondary">
              Download list
            </button>

            <button id="printBtn" class="secondary">
              Print
            </button>
          </div>
        </div>

      </div>
    </section>

    <div id="status" class="status" role="status"></div>

    <footer>
      Made with care, just for you ♡
    </footer>

  </main>

  <!-- ADD / EDIT MODAL -->
  <div id="modal" class="modal">
    <div class="modal-box">

      <h2 id="modalTitle">Add a new item</h2>

      <label for="itemInput">Item name</label>

      <input
        id="itemInput"
        type="text"
        placeholder="What do you need?"
        maxlength="100"
      >

      <label for="categoryInput">Category</label>

      <select id="categoryInput"></select>

      <div class="modal-actions">
        <button id="cancelBtn" class="secondary">
          Cancel
        </button>

        <button id="saveBtn" class="primary">
          Save item
        </button>
      </div>

    </div>
  </div>

  <script type="module" src="js/script.js"></script>

</body>
</html>
